<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>teve[RE] — Tevere Pilot World | RE Token</title>
    <meta name="description" content="teve[RE] — a Web3 + AR game that turns Rome's Tevere waste into raw-luxury craft objects. Interactive prototype." />
    <style>
      :root {
        --green-darker: #1b5e2a;
        --gold: #c8a96a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .page {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .bar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px;
        background: var(--green-darker);
        color: #fff;
      }
      .bar .left { display: flex; align-items: center; gap: 14px; min-width: 0; }
      .bar a {
        color: #fff;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }
      .bar a:hover { opacity: 0.85; }
      .bar .title {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.7);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bar .open {
        background: var(--gold);
        padding: 8px 16px;
        border-radius: 6px;
      }
      .frame-wrap { flex: 1 1 auto; position: relative; }
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .fallback {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #fff;
        text-align: center;
        padding: 24px;
        pointer-events: none;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="bar">
        <div class="left">
          <a href="/">&larr; Back to reforgood.org</a>
          <span class="title">teve[RE] // Tevere Pilot World — Interactive Prototype</span>
        </div>
        <a
          class="open"
          href="https://statuesque-donut-46bcaa.netlify.app/"
          target="_blank"
          rel="noopener noreferrer"
          >Open in new tab &#8599;</a
        >
      </div>
      <div class="frame-wrap">
        <iframe
          src="https://statuesque-donut-46bcaa.netlify.app/"
          title="teve[RE] — Spatial Mining OS"
          allow="camera; microphone; geolocation; accelerometer; gyroscope; fullscreen; xr-spatial-tracking"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen
        ></iframe>
      </div>
    </div>
  </body>
</html>
